<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Solar System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle, #101b3b, #02030c 75%);
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    position: absolute;
    top: 25px;
    width: 100%;
    text-align: center;
    color: #ffe5a0;
    letter-spacing: 5px;
    text-shadow: 0 0 20px orange;
    z-index: 5;
}

.space {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
}

.sun {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff7a0, #ff9800, #ff4500);
    box-shadow: 0 0 30px #ff9800, 0 0 80px #ff6500;
    position: absolute;
    z-index: 2;
}

.orbit {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    animation: rotate linear infinite;
}

.planet {
    position: absolute;
    top: 50%;
    left: 100%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    box-shadow: 0 0 12px currentColor;
}

.mercury-orbit { width: 120px; height: 120px; animation-duration: 5s; }
.venus-orbit   { width: 180px; height: 180px; animation-duration: 8s; }
.earth-orbit   { width: 250px; height: 250px; animation-duration: 12s; }
.mars-orbit    { width: 320px; height: 320px; animation-duration: 17s; }
.jupiter-orbit { width: 410px; height: 410px; animation-duration: 25s; }
.saturn-orbit  { width: 510px; height: 510px; animation-duration: 32s; }
.uranus-orbit  { width: 600px; height: 600px; animation-duration: 40s; }
.neptune-orbit { width: 690px; height: 690px; animation-duration: 48s; }

.mercury { width: 9px; height: 9px; background: #aaa; }
.venus { width: 15px; height: 15px; background: #e6b566; }
.earth { width: 18px; height: 18px; background: #168cff; }
.mars { width: 13px; height: 13px; background: #e74c3c; }
.jupiter { width: 34px; height: 34px; background: #d69b69; }
.saturn { width: 29px; height: 29px; background: #e8cf8b; }
.uranus { width: 23px; height: 23px; background: #73e1df; }
.neptune { width: 22px; height: 22px; background: #345bff; }

.saturn::after {
    content: "";
    position: absolute;
    width: 48px;
    height: 12px;
    border: 3px solid #e6c78c;
    border-radius: 50%;
    top: 7px;
    left: -10px;
    transform: rotate(-25deg);
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

.info {
    position: absolute;
    bottom: 25px;
    text-align: center;
    width: 100%;
    color: #aebce5;
    letter-spacing: 2px;
    font-size: 13px;
}

@media(max-width: 750px) {
    .orbit {
        transform: scale(0.65);
    }
    h1 { font-size: 20px; }
}
</style>
</head>

<body>

<h1>✦ SOLAR SYSTEM ✦</h1>

<div class="stars" id="stars"></div>

<div class="space">

    <div class="sun"></div>

    <div class="orbit mercury-orbit">
        <div class="planet mercury"></div>
    </div>

    <div class="orbit venus-orbit">
        <div class="planet venus"></div>
    </div>

    <div class="orbit earth-orbit">
        <div class="planet earth"></div>
    </div>

    <div class="orbit mars-orbit">
        <div class="planet mars"></div>
    </div>

    <div class="orbit jupiter-orbit">
        <div class="planet jupiter"></div>
    </div>

    <div class="orbit saturn-orbit">
        <div class="planet saturn"></div>
    </div>

    <div class="orbit uranus-orbit">
        <div class="planet uranus"></div>
    </div>

    <div class="orbit neptune-orbit">
        <div class="planet neptune"></div>
    </div>

</div>

<div class="info">
    EXPLORE THE UNIVERSE • 8 PLANETS • ONE SUN
</div>

<script>
const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {
    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";

    stars.appendChild(star);
}
</script>

</body>
</html>
